version: '3.8'

services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: hyperlocal_timescale_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hyperlocal_weather}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - timescale_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hyperlocal_weather}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hyperlocal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  timescale_postgis_data:
    driver: local
