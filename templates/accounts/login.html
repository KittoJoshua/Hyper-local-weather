{% extends 'base.html' %}

{% block title %}Farmer Login | MicroClimate Kenya{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="bg-light d-inline-flex p-3 rounded-circle text-success mb-2">
              <i class="bi bi-cloud-sun fs-1"></i>
            </div>
            <h3 class="fw-bold">Farmer Sign In</h3>
            <p class="text-muted small">Access hyper-local micro-climate forecasts and crop alerts</p>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label small fw-semibold">Phone Number or Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="e.g. 0712345678 or kitto" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">
              Sign In to Dashboard
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">Don't have an account yet? 
              <a href="{% url 'register' %}" class="text-success fw-bold text-decoration-none">Register Plot</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
